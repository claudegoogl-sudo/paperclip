services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      # No default on purpose: a shipped password is a known credential on every
      # install, and this database holds agent credentials and secret material.
      # `:?` makes Compose refuse to start rather than boot on a weak default.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set a strong password in docker/.env, e.g. one generated by 'openssl rand -hex 32' — see doc/DOCKER.md}"
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      # Loopback by default: UFW/iptables INPUT rules do not filter
      # Docker-published ports, so this bind address is the effective control.
      - "${PAPERCLIP_DB_BIND_ADDR:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      # Loopback by default: UFW/iptables INPUT rules do not filter
      # Docker-published ports, so this bind address is the effective control.
      - "${PAPERCLIP_BIND_ADDR:-127.0.0.1}:3100:3100"
    environment:
      # Same variable as the db service so the two cannot drift. The value lands
      # in a URL userinfo field, so it must be percent-encoding-safe; the
      # documented 'openssl rand -hex 32' recipe is.
      DATABASE_URL: "postgres://paperclip:${POSTGRES_PASSWORD:?set a strong password in docker/.env, e.g. one generated by 'openssl rand -hex 32' — see doc/DOCKER.md}@db:5432/paperclip"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
