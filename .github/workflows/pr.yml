name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    branches:
      - master
      # Stacked PRs land on long-lived upstream-sync integration branches
      # (see .github/workflows/pr.yml's own head_ref exemption below, and the
      # upstream-sync routine). `branches:` filters on the PR's *base*, so
      # without this entry those PRs get zero pr.yml runs, not a skipped
      # check — the largest, riskiest merges (sync conflict resolution)
      # would ship with no CI signal at all.
      - 'sync/upstream-**'
  # Merge queue. No `branches:` filter: the queue ref is
  # refs/heads/gh-readonly-queue/<base>/..., so a `branches: [master]` filter
  # would match nothing and the required `verify` check would never report.
  merge_group:
    types: [checks_requested]

# PR runs share one group per PR number and cancel superseded pushes. Each
# merge-queue entry gets its own group (keyed on the speculative head sha)
# and is never cancelled, so sibling queue entries cannot cancel each other.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Event-agnostic diff range for every diff-based guard below. On
# pull_request these are the PR base/head; on merge_group they are the queue
# entry's base (the queue's base ref tip) and its speculative merge commit.
# Steps read these from the environment; never template them into run: lines.
env:
  DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    # Master requires CODEOWNERS review for .github/**, including this workflow.
    # The AWS runner group permits pr-trusted.yml@refs/heads/master.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@master
