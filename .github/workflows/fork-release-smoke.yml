name: Fork Release Smoke Verify

# Post-publish smoke for a fork release: clean-install the PUBLISHED release
# set from the real release URLs into a sandbox, boot the server twice against
# the scratch embedded-Postgres DB, seed one stranded deferred wake between
# the boots, and require the startup stranded deferred-wake sweep to log a
# positive pass (promoted or resolved > 0) on the second boot with no startup
# recovery errors. boot.log + preflight summaries are uploaded as artifacts on
# every run so the evidence is auditable.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to smoke (e.g. 2026.908.1-fork.44)
        required: true
        type: string
      tag:
        description: Release tag (defaults to v<version>)
        required: false
        type: string
      pg_port:
        description: Scratch embedded-Postgres port
        required: false
        type: string
        default: "35432"
      http_port:
        description: Scratch server HTTP port
        required: false
        type: string
        default: "3100"

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  TAG: ${{ inputs.tag || format('v{0}', inputs.version) }}
  PG_PORT: ${{ inputs.pg_port || '35432' }}
  HTTP_PORT: ${{ inputs.http_port || '3100' }}

jobs:
  smoke:
    name: Smoke (install from release URLs -> seed stranded wake -> boot -> sweep log)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository (release tooling scripts)
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download the published release set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets sandbox
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern '*.tgz' --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern 'SHA256SUMS.txt' --clobber
          ls -la release-assets
          CORE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/paperclipai-${VERSION}.tgz"
          echo "CORE_URL=$CORE_URL" >> "$GITHUB_ENV"

      - name: Preflight part 1 — checksums, closure, exports, clean install (sandbox kept)
        run: |
          set -euo pipefail
          node scripts/fork-release/preflight.mjs \
            --core-url "$CORE_URL" \
            --assets-dir "$PWD/release-assets" \
            --sha256sums "$PWD/release-assets/SHA256SUMS.txt" \
            --workdir "$PWD/sandbox" \
            --pg-port "$PG_PORT" \
            --http-port "$HTTP_PORT" \
            --steps checksums,closure,exports,install \
            --keep --summary smoke-install-summary.json 2>&1 | tee smoke-install.log

      - name: Preflight part 2 — first boot (scratch DB migrations apply)
        run: |
          set -euo pipefail
          node scripts/fork-release/preflight.mjs \
            --core-url "$CORE_URL" \
            --assets-dir "$PWD/release-assets" \
            --sha256sums "$PWD/release-assets/SHA256SUMS.txt" \
            --workdir "$PWD/sandbox" \
            --pg-port "$PG_PORT" \
            --http-port "$HTTP_PORT" \
            --steps boot \
            --keep --summary smoke-boot1-summary.json 2>&1 | tee smoke-boot1.log

      - name: Seed one stranded deferred wake into the scratch DB
        run: |
          set -euo pipefail
          DBDATA="$PWD/sandbox/db"
          [ -f "$DBDATA/PG_VERSION" ] || { echo "scratch DB not initialized at $DBDATA" >&2; exit 1; }
          PGCTL="$(find "$PWD/sandbox/prefix/node_modules/@embedded-postgres" -type f -name pg_ctl -path '*linux-x64*' | head -1)"
          [ -n "$PGCTL" ] && [ -x "$PGCTL" ] || { echo "pg_ctl not found under the bundled @embedded-postgres" >&2; exit 1; }
          SOCKHASH="$(printf %s "$DBDATA" | sha256sum | cut -c1-16)"
          SOCKDIR="/tmp/paperclip-pg-${SOCKHASH}"
          mkdir -p "$SOCKDIR"; chmod 0700 "$SOCKDIR"
          PGUSER_PASS="$(cat "${DBDATA}.pg-credential")"
          # Boot1 teardown stops the scratch Postgres asynchronously (SIGTERM
          # drain can lag seconds); wait for the old postmaster to release the
          # data dir, then clear stale lock files before starting ours.
          for i in $(seq 1 60); do
            if "$PGCTL" -D "$DBDATA" status >/dev/null 2>&1; then
              echo "old postmaster still shutting down; waiting (${i}s)"
              sleep 1
            else
              rm -f "$DBDATA/postmaster.pid" "$DBDATA/postmaster.opts"
              break
            fi
          done
          "$PGCTL" -D "$DBDATA" -o "-k "$SOCKDIR" -p $PG_PORT" -l "$PWD/sandbox/pg-seed.log" -w -t 60 start \
            || { echo "pg_ctl start failed; pg-seed.log:" >&2; tail -50 "$PWD/sandbox/pg-seed.log" >&2; exit 1; }
          for i in $(seq 1 60); do
            [ -S "$SOCKDIR/.s.PGSQL.$PG_PORT" ] && break
            sleep 1
          done
          [ -S "$SOCKDIR/.s.PGSQL.$PG_PORT" ] || { echo "postmaster socket never appeared in $SOCKDIR" >&2; tail -50 sandbox/pg-seed.log; exit 1; }
          export PGPASSWORD="$PGUSER_PASS"
          psql -h "$SOCKDIR" -p "$PG_PORT" -U paperclip -d paperclip -v ON_ERROR_STOP=1 <<'SQL'
          -- Minimal fixed-UUID seed (idempotent): the sweep's no-issueId branch
          -- resolves the wake and logs the positive startup line.
          INSERT INTO companies (id, name) VALUES ('11111111-1111-4111-8111-111111111111', 'fork-release smoke seed') ON CONFLICT (id) DO NOTHING;
          INSERT INTO agents (id, company_id, name) VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111', 'smoke-agent') ON CONFLICT (id) DO NOTHING;
          INSERT INTO agent_wakeup_requests (id, company_id, agent_id, source, payload, status)
          VALUES ('33333333-3333-4333-8333-333333333333',
                  '11111111-1111-4111-8111-111111111111',
                  '22222222-2222-4222-8222-222222222222',
                  'fork-release-smoke', '{}'::jsonb, 'deferred_issue_execution')
          ON CONFLICT (id) DO NOTHING;
          SELECT id, status FROM agent_wakeup_requests WHERE id = '33333333-3333-4333-8333-333333333333';
          SQL
          "$PGCTL" -D "$DBDATA" stop -m fast -w
          echo "seeded stranded deferred wake; cluster stopped clean"

      - name: Preflight part 3 — second boot (sweep must log a positive pass)
        run: |
          set -euo pipefail
          node scripts/fork-release/preflight.mjs \
            --core-url "$CORE_URL" \
            --assets-dir "$PWD/release-assets" \
            --sha256sums "$PWD/release-assets/SHA256SUMS.txt" \
            --workdir "$PWD/sandbox" \
            --pg-port "$PG_PORT" \
            --http-port "$HTTP_PORT" \
            --steps boot \
            --keep --summary smoke-boot2-summary.json 2>&1 | tee smoke-boot2.log

      - name: Assert the stranded deferred-wake sweep logged its startup pass
        run: |
          set -euo pipefail
          BOOTLOG="$PWD/sandbox/boot.log"
          [ -f "$BOOTLOG" ] || { echo "boot.log missing" >&2; exit 1; }
          echo "== sweep lines in boot.log =="
          grep -n "stranded deferred-wake sweep" "$BOOTLOG" | tail -5 || true
          if ! grep -q "startup stranded deferred-wake sweep promoted or resolved wakes" "$BOOTLOG"; then
            echo "PASS LINE MISSING: the startup stranded deferred-wake sweep did not log a promoted/resolved pass" >&2
            exit 1
          fi
          if grep -q "startup heartbeat recovery failed" "$BOOTLOG"; then
            echo "startup heartbeat recovery logged a failure" >&2
            grep -n -m1 -A10 "startup heartbeat recovery failed" "$BOOTLOG" >&2 || true
            exit 1
          fi
          echo "OK: sweep logged its startup pass; no startup recovery errors"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Fork release smoke — ${{ inputs.version }}"
            echo
            echo '```'
            tail -40 smoke-boot2.log 2>/dev/null || true
            echo '```'
            echo
            echo '```'
            grep -n "stranded deferred-wake sweep" sandbox/boot.log 2>/dev/null | tail -5 || echo "(no sweep lines)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-release-smoke-${{ inputs.version }}
          path: |
            smoke-install.log
            smoke-boot1.log
            smoke-boot2.log
            smoke-install-summary.json
            smoke-boot1-summary.json
            smoke-boot2-summary.json
            sandbox/boot.log
            sandbox/pg-seed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up sandbox
        if: always()
        run: rm -rf "$PWD/sandbox" || true
